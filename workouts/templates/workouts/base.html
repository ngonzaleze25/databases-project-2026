{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Workout Builder{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="{% url 'home' %}" class="logo">
        <span class="logo-icon">▲</span> WORKOUT BUILDER
      </a>
      <nav class="site-nav">
        <a href="{% url 'home' %}"          {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Build</a>
        <a href="{% url 'exercise_list' %}" {% if request.resolver_match.url_name == 'exercise_list' %}class="active"{% endif %}>Exercises</a>
        <a href="{% url 'analytics' %}"     {% if request.resolver_match.url_name == 'analytics' %}class="active"{% endif %}>Analytics</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Workout Builder &mdash; Databases Course Project</span>
    </div>
  </footer>

</body>
</html>
