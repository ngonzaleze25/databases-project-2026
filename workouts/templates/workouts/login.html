{% extends "workouts/base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Welcome Back</h1>
  <p class="page-subtitle">Log in to view your workout plans and history.</p>
</div>

<div class="card form-card" style="margin: 0 auto; max-width: 400px;">
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    
    {% if error %}
      <div class="form-error" style="margin-bottom: 1rem; padding: 0.5rem; background: rgba(248,113,113,0.1); border: 1px solid #f87171; border-radius: var(--radius);">
        {{ error }}
      </div>
    {% endif %}

    <div class="form-group" style="margin-bottom: 1rem;">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="john@example.com" required>
    </div>
    
    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    
    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Log In</button>
  </form>
  
  <p style="text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem;">
    Don't have an account? <a href="{% url 'register' %}" style="color: var(--accent);">Sign Up</a>
  </p>
</div>
{% endblock %}
