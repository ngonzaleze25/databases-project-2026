{% extends "workouts/base.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Create an Account</h1>
  <p class="page-subtitle">Join to get your personalized 8-week workout program.</p>
</div>

<div class="card form-card" style="margin: 0 auto; max-width: 400px;">
  <form method="post" action="{% url 'register' %}">
    {% csrf_token %}

    <div class="form-group" style="margin-bottom: 1rem;">
      <label>First Name</label>
      <input type="text" name="name" placeholder="John" required>
    </div>
    
    <div class="form-group" style="margin-bottom: 1rem;">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="john@example.com" required>
    </div>
    
    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    
    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign Up &rarr;</button>
  </form>
  
  <p style="text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem;">
    Already have an account? <a href="{% url 'login' %}" style="color: var(--accent);">Log In</a>
  </p>
</div>
{% endblock %}
